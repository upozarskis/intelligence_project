<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Intel Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. LOGIN SCREEN -->
    <div id="login-container" class="center-box">
        <h1>Intel API Login</h1>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="login-error" class="error"></p>
    </div>

    <!-- 2. MAIN DASHBOARD (Hidden by default) -->
    <div id="dashboard" class="hidden">
        <nav>
            <h2>Cyber Intel</h2>
            <div class="nav-links">
                <button onclick="fetchNews()">Latest News</button>
                <button onclick="fetchTrends()">Google Trends</button>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>
        </nav>

        <main id="content-area">
            <p>Welcome. Please select a category to view data.</p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
